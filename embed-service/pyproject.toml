[project]
name = "vec-stream-embed-service"
version = "0.1.0"
description = "Standalone embedding inference service (bge-small-zh): HTTP /embed with dynamic micro-batching, used by worker/rag instead of in-process models"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy<2",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers>=3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# 可选追踪 extra(默认不装):`pip install .[otel]` / `uv sync --extra otel`。
# 关闭(OTEL_ENABLED!=true)时这些都不被 import,零开销。
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
embed-service = "embed_service.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embed_service"]

[project]
name = "vec-stream-embed-service"
version = "0.1.0"
description = "Standalone embedding inference service (bge-small-zh): HTTP /embed with dynamic micro-batching, used by worker/rag instead of in-process models"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sentence-transformers>=3.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
embed-service = "embed_service.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embed_service"]

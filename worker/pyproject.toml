[project]
name = "vecstream-worker"
version = "0.1.0"
description = "Vector Sync Worker: consume Debezium CDC events, embed text, upsert into pgvector"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.12",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vecstream_worker"]

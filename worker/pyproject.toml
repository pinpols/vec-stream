[project]
name = "vec-stream-worker"
license = {text = "Apache-2.0"}
version = "0.1.0"
description = "Vector Sync Worker: consume Debezium CDC events, embed text, upsert into pgvector"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "numpy<2",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.12",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "openai>=1.40",
]

[project.optional-dependencies]
# 分布式追踪可选依赖。默认 `uv sync` 不装(OTEL_ENABLED 关时代码也不 import otel);
# `uv sync --extra otel` 才装。confluent-kafka 埋点若不可用由 main 的手动 span 兜底。
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-psycopg>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-confluent-kafka>=0.48b0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vec_stream_worker"]

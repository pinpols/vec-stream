[project]
name = "vec-stream-rag"
license = {text = "Apache-2.0"}
version = "0.1.0"
description = "RAG service: semantic /search over pgvector or Qdrant, /ask via OpenAI-compatible APIs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "numpy<2",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
# OpenTelemetry 分布式追踪(可选)。默认 `uv sync` 不装;启用追踪需 `uv sync --extra otel`。
# 运行期由 OTEL_ENABLED=true 触发装配;未装该 extra 时默认路径零开销、不 import otel。
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-psycopg>=0.48b0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vec_stream_rag"]

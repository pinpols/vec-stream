[project]
name = "vecstream-rag"
version = "0.1.0"
description = "RAG service: semantic /search over pgvector (stage 0), /ask with Claude (stage 2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "qdrant-client>=1.12",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vecstream_rag"]

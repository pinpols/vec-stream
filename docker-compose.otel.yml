# ── Jaeger 追踪 overlay(OpenTelemetry / OTLP) ──────────────────────────────
#
# 用法:
#   1) 起 Jaeger(独立 overlay,不动主 docker-compose):
#        docker compose -f docker-compose.otel.yml up -d
#   2) 给要追踪的服务打开追踪,设两个环境变量:
#        宿主机直接跑的进程(embed-service / rag / worker):
#          OTEL_ENABLED=true OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
#        容器内跑(需与本 overlay 同一 docker network):
#          OTEL_ENABLED=true OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
#   3) 打开 Jaeger UI 看链路(含 rag → embed-service 跨服务续接):
#        http://localhost:16686
#
# 端口:
#   16686  Jaeger UI
#   4317   OTLP gRPC receiver(本仓库各服务默认走这个)
#   4318   OTLP HTTP receiver
#
# 关闭追踪 = 不设 OTEL_ENABLED(默认 false),服务零开销、无需装 otel extra。

services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: vec-stream-jaeger
    environment:
      # 打开内置 OTLP receiver(4317 gRPC / 4318 HTTP)。
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    restart: unless-stopped

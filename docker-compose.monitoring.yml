# 独立监控覆盖文件 —— 不修改主 docker-compose.yml。
# 起法:docker compose -f docker-compose.monitoring.yml up -d
#
# worker 在宿主机上运行(非主 compose 服务),在 :9100/metrics 暴露 Prometheus 指标。
# 容器内通过 host.docker.internal 抓宿主机,extra_hosts 把它映射到 host-gateway,
# 因此在 Linux 上也能解析(macOS/Windows Docker Desktop 已内置该主机名)。
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vec-stream-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 🟡 加分项:Grafana 预置 Prometheus 数据源 + 同步/DLQ/slot 大盘。
  grafana:
    image: grafana/grafana:11.2.0
    container_name: vec-stream-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/vec_stream.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prometheus-data:
  grafana-data:

[project]
name = "vec-stream-eval"
version = "0.1.0"
description = "Evaluation harness for vec_stream RAG: retrieval quality (recall@k/MRR), generation quality (faithfulness/citation coverage), and PG vs source consistency reconciliation."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# RAGAS 是重依赖(拉 langchain/datasets 等),仅在做生成质量深度评估时按需安装。
# 未安装时 generation.py 自动回退到轻量自实现 faithfulness/引用覆盖率。
ragas = ["ragas>=0.1", "datasets>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
vec-stream-eval = "vec_stream_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vec_stream_eval"]

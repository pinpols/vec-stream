# Prometheus 抓取配置 —— ENTERPRISE.md M2 领域四 item 7(监控告警:告警规则 + SLO)
#
# worker 在宿主机上运行(非 compose 服务),在 METRICS_PORT(默认 9100)的 /metrics 暴露指标。
# Prometheus 容器通过 host.docker.internal 抓宿主机(见 docker-compose.monitoring.yml 的 extra_hosts)。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: vecstream

# 加载告警规则
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # vecstream worker(宿主机进程):CDC 同步延迟 / DLQ / chunks / slot lag 指标
  - job_name: vecstream-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9100
        labels:
          service: vecstream-worker

  # Prometheus 自监控
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

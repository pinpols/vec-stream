name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate compose and scripts
        env:
          REQUIRE_SHELLCHECK: "true"
        run: bash scripts/validate.sh

  # 每个模块独立一个 job(矩阵展开),互不阻塞、可并行。
  # worker/rag/embed-service 的真模型依赖较重;CI 单测 mock/延迟导入模型路径,
  # 依赖同步跳过本地模型栈,避免 PR 检查卡在重依赖下载。
  lint-and-test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # floor = 覆盖率棘轮门槛(略低于当前实测,只防回退不卡现状;升上去后可逐步抬)
        include:
          - { module: worker, cov: src, floor: 55 }
          - { module: rag, cov: src, floor: 60 }
          - { module: eval, cov: src, floor: 40 }
          - { module: embed-service, cov: src, floor: 75 }

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # 缓存 uv 下载/构建的依赖(torch 等重依赖),按各模块 lock 文件失效。
          enable-cache: true
          cache-dependency-glob: "${{ matrix.module }}/uv.lock"

      - name: Install test dependencies
        run: |
          uv venv --python 3.12
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt \
            --group dev \
            --no-emit-package torch \
            --no-emit-package sentence-transformers \
            --no-emit-package transformers \
            --no-emit-package scikit-learn \
            --no-emit-package scipy \
            --no-emit-package sympy \
            --no-emit-package tokenizers \
            --no-emit-package safetensors \
            --no-emit-package huggingface-hub \
            --no-emit-package hf-xet \
            --no-emit-package networkx \
            > requirements-ci.txt
          uv pip install --python .venv/bin/python -r requirements-ci.txt "pytest-cov>=6.0"
          uv pip install --python .venv/bin/python -e . --no-deps

      # ruff 不是任何模块的依赖,用 uvx 跑固定版本的独立工具
      # (与 .pre-commit-config.yaml 保持同一 pin)。--config 指向仓库根统一规则。
      - name: Ruff lint (root ruff.toml)
        run: uvx ruff@0.8.6 check --config ../ruff.toml .

      - name: Ruff format check
        run: uvx ruff@0.8.6 format --check --config ../ruff.toml .

      # 覆盖率棘轮:per-module --cov-fail-under(实测 worker58/rag66/embed81),只防回退。
      - name: Pytest (coverage)
        run: .venv/bin/python -m pytest -q --cov=${{ matrix.cov }} --cov-report=term-missing --cov-fail-under=${{ matrix.floor }}

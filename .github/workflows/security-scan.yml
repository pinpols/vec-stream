name: Security Scan

# SAST(纯 CI 跑,不依赖 GitHub Advanced Security / code scanning):
# - Bandit:高严重度作硬门禁(防引入高危);中/低危见 artifact
# - Semgrep:规则集扫描,报告制(artifact),不阻塞
# 扫描 4 个 Python 模块(worker/rag/eval/embed-service)的源码。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "bandit[toml]"
      # 高严重度 = 硬门禁;完整报告(含中/低)留 artifact。排除测试目录。
      - run: bandit -r worker rag eval embed-service -x '*/tests/*' --severity-level high
      - run: bandit -r worker rag eval embed-service -x '*/tests/*' -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  semgrep:
    name: Semgrep (SAST rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install semgrep
          semgrep --config=p/python --config=p/security-audit \
            worker rag eval embed-service --json -o semgrep-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json

  pip-audit:
    # SCA(依赖 CVE 扫描):对 4 个模块的 uv.lock 逐一审计。除显式接受并记录的
    # CVE-2025-32434(torch 2.2.2 / Intel macOS,见 docs/SECURITY_BOUNDARY.md)
    # 外,新增依赖漏洞直接阻断。
    name: pip-audit (SCA)
    runs-on: ubuntu-latest
    env:
      PIP_AUDIT_IGNORES: "--ignore-vuln CVE-2025-32434"
    strategy:
      fail-fast: false
      matrix:
        module: [worker, rag, eval, embed-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export requirements from uv.lock
        run: |
          pip install uv
          cd ${{ matrix.module }}
          uv export --frozen --no-emit-project --format requirements-txt > requirements-audit.txt
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r ${{ matrix.module }}/requirements-audit.txt --disable-pip $PIP_AUDIT_IGNORES
      - name: pip-audit JSON report
        if: always()
        run: |
          pip install pip-audit
          pip-audit -r ${{ matrix.module }}/requirements-audit.txt --disable-pip \
            $PIP_AUDIT_IGNORES -f json -o pip-audit-${{ matrix.module }}.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-${{ matrix.module }}
          path: pip-audit-${{ matrix.module }}.json
